
name: Build SKYBOX STUDIO Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find application folder
        shell: pwsh
        run: |
          $app = Get-ChildItem -Path . -Filter app.py -Recurse |
            Select-Object -First 1
          if (-not $app) {
            throw "app.py not found"
          }
          "APP_DIR=$($app.Directory.FullName)" >> $env:GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$env:APP_DIR\requirements-build.txt"
          python -m pip install pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "SKYBOX STUDIO" `
            --add-data "$env:APP_DIR\ui;ui" `
            --distpath dist `
            "$env:APP_DIR\app.py"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: SKYBOX-STUDIO-Windows-EXE
          path: dist/SKYBOX STUDIO.exe
